<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<title>Mapa test</title>

<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<style>
html, body {
  margin: 0;
  height: 100%;
  font-family: Roboto, sans-serif;
}

#map {
  height: 100vh;
  width: 100%;
  background: #F0F0F0;
}

.leaflet-tile {
  filter:
    saturate(1.0)
    contrast(1)
    brightness(0.95);
}

/* TITLE */
#title {
  position: absolute;
  top: 25px;
  left: 25px;
  z-index: 9999;
  font-size: 52px;
  font-style: italic;
  font-weight: 700;
  color: #fff;
  padding: 10px 18px;
  border-radius: 14px;
  backdrop-filter: blur(6px);
  -webkit-backdrop-filter: blur(1px);
  text-shadow: 0 0 12px rgba(124, 123, 123, 0.776);
}

/* SEARCH BOX */
#searchBox {
  position: absolute;
  top: 20px;
  right: 70px;
  z-index: 9999;
  padding: 10px 12px;
  border-radius: 8px;
  border: none;
  outline: none;
  width: 220px;
}

#suggestions {
  position: absolute;
  top: 60px;
  right: 70px;
  z-index: 9999;
  width: 220px;
  background: white;
  border-radius: 8px;
  overflow: hidden;
  box-shadow: 0 6px 20px rgba(0,0,0,0.2);
  display: none;
}

.suggestion {
  padding: 8px;
  cursor: pointer;
  font-size: 13px;
}

.suggestion:hover {
  background: #eee;
}

/* INFO*/
#info {
  position: absolute;
  bottom: 20px;
  left: 20px;
  z-index: 9999;
  background: rgba(0,0,0,0.6);
  color: white;
  padding: 10px 14px;
  border-radius: 10px;
}

/* ZOOM */
.zoomBtn {
  position: absolute;
  bottom: 20px;
  right: 20px;
  width: 44px;
  height: 44px;
  border-radius: 10px;
  border: none;
  background: white;
  color: black;
  font-size: 22px;
  font-weight: bold;
  z-index: 9999;
  cursor: pointer;
}

#zoomOut {
  bottom: 70px;
}

/* POPUP */
.popup-btn {
  margin-top: 10px;
  padding: 6px 10px;
  border: none;
  border-radius: 6px;
  cursor: pointer;
}

.done-btn {
  background: black;
  color: white;
}

.close-btn {
  background: #ddd;
}

.leaflet-popup-close-button {
  left: 10px !important;
  right: auto !important;
}
</style>
</head>

<body>

<div id="title"></div>

<input id="searchBox" type="text" placeholder="buscar dirección" />
<div id="suggestions"></div>

<div id="info">Haz click en el mapa para crear un pin</div>

<div id="map"></div>

<button class="zoomBtn" id="zoomIn">+</button>
<button class="zoomBtn" id="zoomOut">−</button>

<script type="module">
  import { initializeApp }
    from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import {
      getFirestore,
    collection,
    addDoc,
    getDocs,
    doc,
    updateDoc,
    increment
  } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";


  // FIREBASE  
  const firebaseConfig = {
    apiKey: "AIzaSyAWGffQhe1R_lSjaXGvMsLwYlTZILgoJ7s",
    authDomain: "digitalull.firebaseapp.com",
    projectId: "digitalull",
    storageBucket: "digitalull.firebasestorage.app",
    messagingSenderId: "421274305167",
    appId: "1:421274305167:web:750093830e5718f9e426fa",
    measurementId: "G-5NTRRTN0T0"
  };

  const app = initializeApp(firebaseConfig);
  const db  = getFirestore(app);

  //  MAP: centred on Barcelona
  const map = L.map('map').setView([41.4036, 2.1744], 13);

  L.tileLayer(
    'https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png',
    {
      attribution: '&copy; OpenStreetMap &copy; CARTO',
      subdomains: 'abcd',
      maxZoom: 20
    }
  ).addTo(map);

  // LAYER OVERLAY
L.tileLayer(
  'https://{s}.basemaps.cartocdn.com/rastertiles/voyager_only_labels/{z}/{x}/{y}{r}.png',
  {
    opacity: 1.0,
    subdomains: 'abcd',
    maxZoom: 20
  }
).addTo(map);

  // PINS ABOVE STREET
  map.createPane('alwaysOnTopPane');
  map.getPane('alwaysOnTopPane').style.zIndex        = 650;
  map.getPane('alwaysOnTopPane').style.pointerEvents = 'auto';

  // PENDING PINS
  let pinId = 0;
  const pending = {};

  // PIN ICON
  function createPin(color = "#FCFDF8") {
    return L.divIcon({
      className: "",
      html: `
        <div style="
          width: 14px;
          height: 14px;
          background: ${color};
          transform: rotate(44.87deg);
          border-radius: 50%;
          position: absolute;
        "></div>
      `,
      iconSize:   [14, 14],
      iconAnchor: [7, 7]
    });
  }

  // NEW-PIN POPUP
  function newPinPopup(id) {
    return `
      <div style="max-width:220px;">
        <h3 style="margin:0 0 8px 0;">Comparte tu experiencia</h3>
        <p>1 Haz clic en un lugar en el mapa.</p>
        <p>2 Escribe tu experiencia, historia o sensación relacionada con ese lugar.</p>
        <p>3 Haz clic en «¡Hecho!».</p>
        <div style="margin-bottom:8px;">
          <label style="font-size:12px;">Nombre o identificador:</label>
          <input
            type="text"
            id="name-${id}"
            placeholder="Tu nombre no aparecerá en el mapa."
            style="
              width: 100%;
              margin-top: 4px;
              padding: 6px;
              border-radius: 6px;
              border: 1px solid #ccc;
              box-sizing: border-box;
            "
          >
        </div>
        <textarea
          id="msg-${id}"
          style="
            width: 100%;
            height: 60px;
            border-radius: 6px;
            box-sizing: border-box;
          "
          placeholder="Escribe aquí tu historia..."
        ></textarea>
        <div style="margin-top:8px;">
          <label style="font-size:12px;">Color del pin:</label>
          <input type="color" id="color-${id}" value="#ff4fd8">
        </div>
        <button class="popup-btn done-btn" onclick="window.savePin(${id})">
          ¡Hecho!
        </button>
        <button class="popup-btn close-btn" onclick="window.cancelPin(${id})">
          Cerrar
        </button>
      </div>
    `;
  }

  // SAVED-PIN POPUP: W/o Author
  function savedPinPopup(message, docId, likes = 0) {
  return `
    <div style="max-width:220px;">
      ${message ? `<p style="margin:0;">${message}</p>` : "<em>Sin mensaje.</em>"}
      <button
        onclick="window.addLike('${docId}', this)"
        style="
          margin-top: 10px;
          background: none;
          border: none;
          cursor: pointer;
          font-size: 18px;
          padding: 0;
        "
      >
        ❤️ <span>${likes}</span>
      </button>
    </div>
  `;
}


  // MAP CLICK: temporary pin
  map.on("click", function(e) {
    const id     = pinId++;
    const marker = L.marker(e.latlng, {
      icon: createPin(),
      pane: 'alwaysOnTopPane'
    }).addTo(map);

    pending[id] = { marker, saved: false };

    marker.bindPopup(newPinPopup(id)).openPopup();

    // Close temporary pin
    marker.on("popupclose", () => {
      if (!pending[id]?.saved) {
        map.removeLayer(marker);
      }
      delete pending[id];
    });
  });

  // SAVE PIN: Save to Firestone
  window.savePin = async function(id) {
    const entry = pending[id];
    if (!entry) return;

    const { marker } = entry;

    const colorInput = document.getElementById(`color-${id}`);
    const msgInput   = document.getElementById(`msg-${id}`);
    const nameInput  = document.getElementById(`name-${id}`);

    const color   = colorInput ? colorInput.value : "#ff4fd8";
    const message = msgInput   ? msgInput.value   : "";
    const author  = nameInput  ? nameInput.value  : "";

    // Mark as saved
    pending[id].saved = true;

    marker.setIcon(createPin(color));

    marker.unbindPopup();
    marker.bindPopup(savedPinPopup(message, "", 0));
    marker.closePopup();

    // Save to Firestore
    try {
      await addDoc(collection(db, "entries"), {
        lat:       marker.getLatLng().lat,
        lng:       marker.getLatLng().lng,
        author:    author,   
        message:   message,
        color:     color,
        likes:     0,
        createdAt: Date.now()
      });
    } catch (err) {
      console.error("Firestore write error:", err);
    }
  };

  // CANCEL PIN 
  window.cancelPin = function(id) {
    const entry = pending[id];
    if (!entry) return;
    map.removeLayer(entry.marker);
    delete pending[id];
  };

  // ADD LIKES
  window.addLike = async function(docId, btn) {
    console.log("docId recibido:", docId);
    btn.disabled = true;
    const count  = btn.querySelector("span");
    count.textContent = Number(count.textContent) + 1;

    try {
      const ref = doc(db, "entries", docId);
      console.log("ref creada:", ref);
      await updateDoc(ref, {
        likes: increment(1)
      });
      console.log("Like guardado OK");
    } catch (err) {
      console.error("Like error completo:", err);
      console.error("Código:", err.code);
      console.error("Mensaje:", err.message);
    }
  };


  // ZOOM CONTROLS 
  document.getElementById("zoomIn").onclick  = () => map.zoomIn();
  document.getElementById("zoomOut").onclick = () => map.zoomOut();

  // SEARCH AUTOCOMPLETE
  const searchInput   = document.getElementById("searchBox");
  const suggestionBox = document.getElementById("suggestions");
  let debounceTimer;

  // SELECT BY ENTER
  searchInput.addEventListener("keydown", (e) => {
    if (e.key === "Enter") {
      const first = suggestionBox.querySelector(".suggestion");
      if (first) first.click();
    }
  });

  searchInput.addEventListener("input", () => {
    clearTimeout(debounceTimer);

    const query = searchInput.value;
    if (query.length < 3) {
      suggestionBox.style.display = "none";
      return;
    }

    debounceTimer = setTimeout(async () => {
      try {
        const res  = await fetch(
          `https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(query)}`
        );
        const data = await res.json();

        suggestionBox.innerHTML     = "";
        suggestionBox.style.display = "block";

        data.slice(0, 5).forEach(place => {
          const div     = document.createElement("div");
          div.className = "suggestion";
          div.innerText = place.display_name;

          div.onclick = () => {
            // ERASE SEARCH
            if (window._searchMarker) {
              map.removeLayer(window._searchMarker);
            }

            map.setView([place.lat, place.lon], 16);
            searchInput.value           = place.display_name;
            suggestionBox.style.display = "none";

            // TEMPORARY SEARCH PIN
            window._searchMarker = L.marker([place.lat, place.lon], {
              icon: L.divIcon({
                className: "",
                html: `
                  <div style="
                    width: 18px;
                    height: 18px;
                    background: #ff4fd8;
                    border: 3px solid white;
                    border-radius: 50%;
                    box-shadow: 0 0 0 3px #ff4fd8;
                  "></div>
                `,
                iconSize:   [18, 18],
                iconAnchor: [9, 9]
              }),
              pane: 'alwaysOnTopPane'
            })
            .addTo(map)
            .bindPopup(`<div style="font-size:13px;">${place.display_name}</div>`)
            .openPopup();
          };                              

          suggestionBox.appendChild(div);
        });                              

      } catch (err) {
        console.error("Nominatim search error:", err);
      }
    }, 300);                              
  });                                     

  // HIDE SUGGESTIONS
  document.addEventListener("click", (e) => {
    if (!e.target.closest("#searchBox") && !e.target.closest("#suggestions")) {
      suggestionBox.style.display = "none";
    }
  });

  searchInput.addEventListener("focus", () => {
    if (suggestionBox.innerHTML.trim() !== "") {
      suggestionBox.style.display = "block";
    }
  });

  // LOAD PINS FIRESTONE
  async function loadPins() {
    try {
      const snapshot = await getDocs(collection(db, "entries"));

      snapshot.forEach((docSnap) => {
        const data = docSnap.data();

        if (!data.lat || !data.lng) return; 

        const marker = L.marker(
          [data.lat, data.lng],
          {
            icon: createPin(data.color || "#ff4fd8"),
            pane: 'alwaysOnTopPane'
          }
        ).addTo(map);

        console.log("Pin cargado:", docSnap.id, "likes:", data.likes);
        marker.bindPopup(savedPinPopup(data.message, docSnap.id, data.likes || 0));
      });

    } catch (err) {
      console.error("Firestore load error:", err);
    }
  }
  loadPins();

</script>

</body>
</html>
