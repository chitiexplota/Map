<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<title>Mapa test</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<link rel="stylesheet" href="style.css">
</head>

<body>

<img src="logo.png" class="logo" alt="Logo">

<div id="title"></div>

<input id="searchBox" type="text" placeholder="buscar dirección" aria-label="Buscar dirección" />
<div id="suggestions" role="listbox" aria-label="Sugerencias de direcciones"></div>

<div id="info" aria-live="polite">Haz click en el mapa para crear un pin</div>

<div id="map" role="application" aria-label="Mapa interactivo de Barcelona" tabindex="0"></div>

<button class="zoomBtn" id="zoomIn" aria-label="Acercar mapa">+</button>
<button class="zoomBtn" id="zoomOut" aria-label="Alejar mapa">−</button>

<button class="zoomBtn" id="contrastToggle" aria-label="Alternar alto contraste" style="bottom: 120px;">◐</button>

<button class="zoomBtn" id="listToggle" aria-label="Ver lista de lugares" style="bottom: 170px;">☰</button>
<div id="pinList" style="display:none; 
  position:absolute; 
  top:0; right:0; width:280px; height:100%; 
  background:white; overflow-y:auto; 
  z-index:10000; 
  padding:20px;
  box-sizing:border-box;"></div>

<script type="module" src="script.js"></script>

</body>
</html>
